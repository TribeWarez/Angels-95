name=Floater
; Flies at ~58% of the player's walk: it should arrive from an angle the ground
; enemies cannot take, not hover in place.
speed=4.4
aggroRange=8.0
attackRange=3.0
damage=15.0
maxHealth=80
sprite_path=GameData/Pawn/Pawns/FloaterBody.png
scream_path=GameData/Pawn/Pawns/Floater.wav
; Replaced the sprite-only sprite with the FlyingPSX XenoWasp model. The
; GLB has the body and wing textures embedded, so model_texture stays empty
; (same convention as Walker/Spider).
model_path=GameData/Pawn/Pawns/XenoWasp.glb
model_texture=
model_scale=0.5
mesh_type=static
; Wing-flap clips generated from the model's geometry (the GLB has no rig). The
; Wing.L/Wing.R nodes are addressed by name, so the wings beat while the body
; bobs; `hover` below keeps the whole pawn airborne.
animfile=GameData/Pawn/Pawns/Anims/Floater.ozanim
anim_idle=Idle
anim_patrol=Idle
anim_chase=Fly
anim_return=Idle
anim_death=Death
anim_speed=1.0
; A wasp should hover, not stand on the floor: skip gravity/ground snap and bob
; around the authored spawn height. Without this the def was grounded like a
; walker and the "air floating" was the ungrounded pivot, not intent.
hover=1
hover_amplitude=0.35
hover_speed=1.6
