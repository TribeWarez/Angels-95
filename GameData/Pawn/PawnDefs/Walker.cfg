name=Walker
; Chase speed is a fraction of the player's walk (5.4 * movement_speed 1.4 =
; 7.56 u/s; sprint 12.1): 3.8 is ~50%, so a Walker closes while you fight but
; sprinting still disengages. At the old 1.5 no enemy could apply the pressure
; the maps author ("crossfire", "flank") — they could never reach the player.
speed=3.8
aggroRange=6.0
attackRange=1.5
damage=10.0
maxHealth=100
sprite_path=GameData/Pawn/Pawns/Walker.png
scream_path=GameData/Pawn/Pawns/Walker.wav
; Huntsman spider from the PSX library. The GLB has no rig and no clips, so it
; animates through a vertex-keyframe .ozanim generated from its own geometry
; (tools/gen_pawn_anims.py). Without the animfile the def could only do the 6cm
; walk bob, which is what every enemy but the Brute was limited to.
; The texture is embedded in the GLB so model_texture is left empty.
model_path=GameData/Pawn/Pawns/Huntsman_spider.glb
model_texture=
model_scale=1.0
mesh_type=static
animfile=GameData/Pawn/Pawns/Anims/Walker.ozanim
anim_idle=Idle
anim_patrol=Walk
anim_chase=Run
anim_return=Walk
anim_death=Death
anim_speed=1.0
