; Angels95 player character roster.
;
; One section per character. The section name is the stable id stored in
; System/PlayerProfiles.ini and sent on the wire; keep it to A-Z, a-z, 0-9, '_'
; and '-' (max 31 chars). Order= controls the display order.
;
; Keys:
;   name        display name (required)
;   mesh        model path (required)
;   texture     optional diffuse override
;   mesh_type   static | skeletal (default static)
;   portrait    optional authored portrait; empty = render the mesh
;   bio         flavour text
;   accent      palette index 0..7 for the card accent
;   anim_idle   optional skeletal clip name
;   anim_chase  optional skeletal clip name
;
; Paths are relative to the repo root (GameData/...) and are audited by
; `worldcheck --asset-refs`. Do not put a semicolon in a value.

[Roster]
Order=arcanist,killer

[arcanist]
name=Plague Arcanist
mesh=GameData/Pawn/Player/Plague_Arcanist.glb
mesh_type=skeletal
; Clip names are raylib's truncated glTF names (ModelAnimation.name is char[32],
; so the full "Armature|Armature.00N|mixamo.com|Layer0" arrives as
; "Armature|Armature.00N|mixamo.co"). Picked by measuring each take: .002 is the
; lowest-motion 1.1s loop (idle), .008 is the fastest leg cadence (a step cycle).
anim_idle=Armature.002
anim_chase=Armature.008
bio=Keeper of the ninth seal. His armor remembers every name it has erased.
accent=6

[killer]
name=Killer
mesh=GameData/Pawn/Player/Character_Killer_01.glb
texture=GameData/Pawn/Player/Character_Killer_01.png
mesh_type=static
bio=A silent blade from the old arenas. No one has seen the face behind the mask.
accent=1
