name: Build

on:
  push:
    branches: [ "*" ]
    tags: [ 'b*' ]
  pull_request:
    branches: [ "*" ]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            g++ make libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxext-dev \
            libasound2-dev libpulse-dev cmake

      - name: Cache raylib
        id: cache-raylib
        uses: actions/cache@v4
        with:
          path: /tmp/raylib-install
          key: raylib-5.5-${{ runner.os }}

      - name: Build raylib from source
        if: steps.cache-raylib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/raylib-install \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF
          cmake --build /tmp/raylib/build --parallel
          cmake --install /tmp/raylib/build

      - name: Install raylib
        run: |
          if [ -d /tmp/raylib-install ]; then
            sudo cp -r /tmp/raylib-install/* /usr/local/
          fi

      - name: Build server (AngelServ)
        run: make AngelServ

      - name: Build worldcheck (the .ozone auditor; run in a later step)
        run: make worldcheck

      - name: Build client (Angels95)
        run: make OTENGINE

      - name: Build and run the test suites
        run: |
          # `make test` is authoritative now: every suite runs, its EXIT CODE is
          # recorded, and the target prints the names of the failures and exits 1.
          # That closes two holes at once:
          #   * the old recipe used `-./suite`, which told make to ignore the
          #     status, so a suite that CRASHES (segfault / uncaught exception,
          #     which prints no FAIL line) passed both make and the grep below;
          #   * the list of suites was written twice (prerequisites and runner
          #     lines), so a new suite could be built but never run.
          # It also runs tools/check_editor_objects.sh and worldcheck over every
          # shipped world, so those cannot silently stop being exercised either.
          make test

      - name: Run worldcheck on every world
        run: |
          failed=0
          ./worldcheck GameData/Worlds/CitadelRuins/World.ozone || failed=1
          ./worldcheck GameData/Worlds/Dessert_Dreams/World.ozone || failed=1
          ./worldcheck GameData/Worlds/Dust_Ravine/World.ozone || failed=1
          ./worldcheck GameData/Worlds/EngineTest/World.ozone || failed=1
          # World_endless_snow places GLB models, so its mesh-size gate needs
          # --glb-bounds. The JSON is committed next to the world and is
          # regenerated with:
          #   python tools/glb_bounds.py --emit-json \
          #     GameData/Worlds/World_endless_snow \
          #     GameData/Worlds/World_endless_snow/glb_bounds.json
          # Regenerate it whenever a model under that world's Models/ is added,
          # replaced or rescaled, otherwise the size check silently degrades to
          # a no-op for models missing from the file.
          ./worldcheck GameData/Worlds/World_endless_snow/World.ozone \
            --glb-bounds GameData/Worlds/World_endless_snow/glb_bounds.json || failed=1
          # --asset-refs is GameData-wide (not world-scoped): it audits every
          # path-valued key in .ozls/.cfg and the levelinfo skybox pair against
          # the filesystem. Paths whose basename is in tools/assetrefs-allow.txt
          # are pre-existing missing content; anything else is a dangling
          # reference and fails. `make test` runs it too, so the Windows job
          # covers it as well.
          ./worldcheck GameData/Worlds/EngineTest/World.ozone --asset-refs || failed=1
          exit $failed

      - name: Verify committed GLB bounds are up to date
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check glb_bounds.json is current
        run: |
          # Guards against the mesh-size gate silently going stale. Regenerating
          # must be a no-op; if this fails, a model changed without its bounds
          # JSON being refreshed.
          python tools/glb_bounds.py --emit-json \
            GameData/Worlds/World_endless_snow \
            GameData/Worlds/World_endless_snow/glb_bounds.json.regen
          if ! diff -u GameData/Worlds/World_endless_snow/glb_bounds.json \
                      GameData/Worlds/World_endless_snow/glb_bounds.json.regen; then
            echo "::error::glb_bounds.json is stale - regenerate and commit it (see step above)"
            exit 1
          fi

      - name: Build OzPack
        run: make ozpack

      - name: Build master server (AngelMaster)
        run: make AngelMaster

      - name: Smoke test server
        run: |
          timeout 3 ./AngelServ --dir GameData --port 27015 --http-port 8080 2>&1 | head -20

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: AngelServ-linux
          path: AngelServ

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        with:
          name: Angels95-linux
          path: Angels95

      - name: Upload OzPack binary
        uses: actions/upload-artifact@v4
        with:
          name: OzPack-linux
          path: OzPack

      - name: Upload master server binary
        uses: actions/upload-artifact@v4
        with:
          name: AngelMaster-linux
          path: AngelMaster

      # --- Tagged release: attach each Linux binary as a directly downloadable asset ---
      - name: Stage release assets (Linux)
        if: startsWith(github.ref, 'refs/tags/b')
        run: |
          tag="${{ github.ref_name }}"
          mkdir -p release
          cp AngelServ   "release/AngelServ-${tag}-linux-x86_64"
          cp AngelMaster "release/AngelMaster-${tag}-linux-x86_64"
          cp Angels95    "release/Angels95-${tag}-linux-x86_64"
          cp OzPack      "release/OzPack-${tag}-linux-x86_64"
          chmod +x release/*
          ls -la release

      - name: Attach Linux binaries to release
        if: startsWith(github.ref, 'refs/tags/b')
        uses: softprops/action-gh-release@v2
        with:
          name: Angels95 Build ${{ github.ref_name }}
          body: |
            ## Angels95 ${{ github.ref_name }}

            ### Downloads
            **Runs directly (binary only; AngelServ additionally needs a game-data checkout to serve):**
            - `AngelServ-<tag>-<platform>` - dedicated game server (self-contained; point `--dir` at a `GameData/` with `Worlds/<Name>/World.ozone`)
            - `AngelMaster-<tag>-<platform>` - master/listing server
            - `OzPack-<tag>-<platform>` - asset packer CLI

            **Requires the full `System-<tag>.zip`** (raylib/GLFW DLLs, the packaged
            assets in `System/Data`, INI templates, run scripts,
            `angels95-serv.service`). The client loads everything from the packages,
            so the zip needs no loose GameData tree:
            - `Angels95-<tag>-windows-x86_64.exe` - game client
            - `AngelEd-<tag>-windows-x86_64.exe` - editor (Windows only; Win32 native panels)

            Platform notes:
            - Linux binaries are dynamically linked against the distro's glibc; run on a modern x86_64 Linux.
            - `AngelEd` is Windows-only (Win32 API); there is no Linux build.
            - `AngelServ` reads loose world files, so it needs a game-data checkout
              (`--dir <GameData>` containing `Worlds/<Name>/World.ozone`); the zip's
              packaged data serves the client and the editor's asset browser.
            - For VPS systemd units see `System/angels95-serv.service`; config lives in
              `System/OzServer.ini` (`--bind 0.0.0.0` to accept remote clients).
          files: release/*

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            make

      - name: Check toolchain
        run: |
          uname -s
          g++ --version | head -1
          make --version | head -1

      - name: Build raylib from source
        run: |
          curl -sL https://github.com/raysan5/raylib/archive/refs/tags/5.5.tar.gz | tar -xz -C /tmp
          cd /tmp/raylib-5.5/src
          make PLATFORM=PLATFORM_DESKTOP -j
          mkdir -p /mingw64/include /mingw64/lib
          cp raylib.h raymath.h rlgl.h /mingw64/include/
          cp libraylib.a /mingw64/lib/

      - name: Build server (AngelServ)
        run: make AngelServ SERVER_CXX=g++

      - name: Build client (Angels95)
        run: make OTENGINE

      - name: Build OzPack
        run: make ozpack

      - name: Build master server (AngelMaster)
        run: make AngelMaster SERVER_CXX=g++

      # The Windows job used to BUILD but never TEST, so a suite that only breaks
      # under MinGW - a header glibc forgives, a path separator, a Windows-only
      # API pulled into a shared TU - was invisible here and only surfaced on a
      # developer's machine. `make test` needs nothing the build steps have not
      # already produced (raylib lands in /mingw64, and the raylib-linking suites
      # take RAYLIB_INC from the default).
      - name: Run the test suites
        run: make test SERVER_CXX=g++

      - name: Build editor (AngelEd)
        run: |
          cd AngelEd
          EDITOR_FLAGS="-O3 -g --std=c++20 -Wno-narrowing"
          EDITOR_INC="-I ../Source -I Source"
          EDITOR_LIBS="-lraylib -lopengl32 -lgdi32 -lwinmm -lcomctl32 -lcomdlg32 -lws2_32 -lm"
          
          g++ -fpermissive $EDITOR_FLAGS $EDITOR_INC -c Source/raygui/raygui.c -DRAYGUI_IMPLEMENTATION -o raygui.o
          gcc -O3 -std=c99 -I ../Source/miniz -c ../Source/miniz/miniz.c -o miniz.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c Source/Main.cpp -o Main.o
          # The UI layer: one unity TU (Source/UI/UiShell.cpp includes every
          # Source/UI/Panels/*.cpp). Must match AngelEd/Makefile's WIN32_OBJS = UiShell.o.
          # Adding a panel means adding a fragment, NOT a line here - see UiShell.cpp.
          g++ $EDITOR_FLAGS $EDITOR_INC -c Source/UI/UiShell.cpp -o UiShell.o
          # The editor event bus. Must match AngelEd/Makefile's EDITOR_OBJS.
          g++ $EDITOR_FLAGS $EDITOR_INC -c Source/Core/EditorEventBus.cpp -o EditorEventBus.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Pawn/OzPawnSystem.cpp -o OzPawnSystem.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Renderer/OzAssetMapper.cpp -o OzAssetMapper.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/World/OzOzoneLoader.cpp -o OzOzoneLoader.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/World/OzoneFrustum.cpp -o OzoneFrustum.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/World/OzoneHeightmap.cpp -o OzoneHeightmap.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/World/OzoneParser.cpp -o OzoneParser.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/World/ZoneManager.cpp -o ZoneManager.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/World/SurfaceFlags.cpp -o SurfaceFlags.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Renderer/SurfaceMaterial.cpp -o SurfaceMaterial.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/World/GameType.cpp -o GameType.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Audio/SoundManager.cpp -o SoundManager.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Log.cpp -o Log.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Physics/OzBsp.cpp -o OzBsp.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Physics/AutoConvex.cpp -o AutoConvex.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Physics/WorldChunk.cpp -o WorldChunk.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Renderer/LitLightning.cpp -o LitLightning.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Renderer/Mesh/Mesh.cpp -o Mesh.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Renderer/Mesh/SkeletalMesh.cpp -o SkeletalMesh.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Renderer/Mesh/MeshCache.cpp -o MeshCache.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Package/Anim/OzAnimFormat.cpp -o OzAnimFormat.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Renderer/Mesh/AnimatedMesh.cpp -o AnimatedMesh.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Particle/OzParticleSimulationManager.cpp -o OzParticleSimulationManager.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Renderer/rlights/rlights.cpp -o rlights.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Script/LightningScriptContext.cpp -o LightningScriptContext.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Script/LightningScriptParser.cpp -o LightningScriptParser.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Script/LightningEntityRegistry.cpp -o LightningEntityRegistry.o
          # Must match AngelEd/Makefile: -DOMEGA_TEST_ENV compiles out the
          # DrawSlotBar call in DrawHotbar (the editor draws the fallback bar).
          # Without it this TU references DrawSlotBar and the link fails on an
          # undefined reference, since SlotBar.cpp is not part of the editor.
          g++ $EDITOR_FLAGS $EDITOR_INC -DOMEGA_TEST_ENV -c ../Source/Script/LightningEntityManager.cpp -o LightningEntityManager.o
          # .ozls writer: raylib-free, used by the Entity Properties panel to
          # write stat edits back to the source file. Must match AngelEd/Makefile.
          g++ $EDITOR_FLAGS $EDITOR_INC -c ../Source/Script/OzlsWriter.cpp -o OzlsWriter.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c Source/EditorIcons.cpp -o EditorIcons.o
          # Resources/ layer: real translation units. AssetScope and PackageIO are each
          # shared by two UI panels but were implemented INSIDE TexturePanel.cpp,
          # reachable from ModelPanel.cpp only because the UI layer is one unity TU.
          # Adding a Resources/ file means adding a line here AND a rule in
          # AngelEd/Makefile - the two lists must stay equal. See
          # Wiki/Editor-Architecture-Refactor.md.
          g++ $EDITOR_FLAGS $EDITOR_INC -c Source/Resources/AssetScope.cpp -o AssetScope.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c Source/Resources/PackageIO.cpp -o PackageIO.o
          # AssetScan is the one Resources object with no headless suite: it reads the
          # filesystem and PackageAssetLoader. Its policy lives in AssetScope.cpp so
          # that part stays covered.
          g++ $EDITOR_FLAGS $EDITOR_INC -c Source/Resources/AssetScan.cpp -o AssetScan.o
          # Subsystems/ promoted to REAL translation units in Phase F (SurfaceOps first).
          # These used to be unity fragments included by Main.cpp, so they inherited its
          # include order and could not be compiled standalone. A new subsystem needs a
          # line here AND a rule in AngelEd/Makefile - the two lists must stay equal.
          g++ $EDITOR_FLAGS $EDITOR_INC -c Source/Subsystems/SurfaceOps.cpp -o SurfaceOps.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c Source/Subsystems/Placement.cpp -o Placement.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c Source/Subsystems/PropsApply.cpp -o PropsApply.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c Source/Subsystems/LevelState.cpp -o LevelState.o
          g++ $EDITOR_FLAGS $EDITOR_INC -c Source/Subsystems/History.cpp -o History.o
          echo 'int main_custom() { return 0; }' | g++ $EDITOR_FLAGS $EDITOR_INC -x c++ -c - -o OTCustom_stub.o
          
          g++ Main.o UiShell.o EditorEventBus.o OzPawnSystem.o OzAssetMapper.o OzOzoneLoader.o OzoneFrustum.o OzoneHeightmap.o OzoneParser.o ZoneManager.o GameType.o SurfaceFlags.o SurfaceMaterial.o SoundManager.o Log.o OzBsp.o AutoConvex.o WorldChunk.o LightningScriptContext.o LightningScriptParser.o LightningEntityRegistry.o LightningEntityManager.o OzlsWriter.o EditorIcons.o AssetScope.o PackageIO.o AssetScan.o SurfaceOps.o Placement.o PropsApply.o LevelState.o History.o LitLightning.o Mesh.o SkeletalMesh.o MeshCache.o AnimatedMesh.o OzAnimFormat.o OzParticleSimulationManager.o rlights.o miniz.o raygui.o OTCustom_stub.o -o AngelEd.exe $EDITOR_FLAGS $EDITOR_INC $EDITOR_LIBS
          cd ..

      - name: Assemble System/ release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path System | Out-Null
          New-Item -ItemType Directory -Force -Path System/Data | Out-Null
          
          # Move EXEs
          Move-Item -Force Angels95.exe System\
          Move-Item -Force AngelServ.exe System\
          Move-Item -Force OzPack.exe System\
          Move-Item -Force AngelMaster.exe System\
          Move-Item -Force AngelEd\AngelEd.exe System\
          
          # Copy DLLs
          Copy-Item /mingw64/bin/libraylib*.dll System\ -ErrorAction SilentlyContinue
          Copy-Item /mingw64/bin/libglfw*.dll System\ -ErrorAction SilentlyContinue
          
          # Create INI files
          @"
          [Video]
          Width=1280
          Height=720
          Fullscreen=0
          VSync=1
          
          [Settings]
          audio_volume=100.000000
          mute=False
          
          [Game]
          ServerIP=127.0.0.1
          ServerPort=27015
          "@ | Set-Content System\Angels95.ini -Encoding UTF8
          
          @"
          [Editor]
          GridSize=1.0
          SnapToGrid=1
          ShowGrid=1
          
          [Video]
          Width=1600
          Height=900
          "@ | Set-Content System\AngelEd.ini -Encoding UTF8
          
          @"
          [Server]
          Port=27015
          HttpPort=8080
          MaxPlayers=16
          WorldDir=GameData
          
          [Game]
          ServerName=Angels95 Server
          "@ | Set-Content System\OzServer.ini -Encoding UTF8
          
          # Create run scripts
          @"
          @echo off
          cd /d "%~dp0.."
          start "" "%~dp0Angels95.exe"
          "@ | Set-Content System\run.bat -Encoding ASCII
          
          @"
          Set-Location -LiteralPath (Split-Path -Parent `$PSScriptRoot)
          & "`$PSScriptRoot\Angels95.exe"
          "@ | Set-Content System\run.ps1 -Encoding UTF8

          # VPS systemd unit; the release notes point at System\angels95-serv.service.
          Copy-Item tools\angels95-serv.service System\angels95-serv.service -Force

      - name: Package assets
        shell: msys2 {0}
        run: |
          # Run packaging in MSYS2 shell so MinGW DLLs are on PATH
          if [ -f ./build-data.ps1 ]; then
            powershell -File ./build-data.ps1
          else
            echo "build-data.ps1 not found, skipping"
          fi

      - name: Verify System/ contents
        shell: pwsh
        run: |
          Write-Host "=== System/ contents ==="
          Get-ChildItem System -Recurse | Select-Object FullName, Length
          
          $required = @("Angels95.exe", "AngelServ.exe", "AngelEd.exe", "OzPack.exe", "AngelMaster.exe")
          $missing = @()
          foreach ($exe in $required) {
            if (-not (Test-Path "System\$exe")) { $missing += $exe }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing EXEs: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All required EXEs present"

          # The zip's GameData REPLACEMENT is the packaged data: without
          # System/Data/*.oz* a bundle ships a client that finds no worlds,
          # defs, HUD art or audio at all.
          $pkgs = @(Get-ChildItem System\Data -Recurse -File -ErrorAction SilentlyContinue)
          if ($pkgs.Count -lt 20) {
            Write-Error "System\Data has only $($pkgs.Count) package file(s) - asset packaging did not run?"
            exit 1
          }
          $zones = @(Get-ChildItem System\Data\Zones -File -ErrorAction SilentlyContinue)
          if ($zones.Count -eq 0) {
            Write-Error "System\Data\Zones has no world packages"
            exit 1
          }
          Write-Host "Packaged data present: $($pkgs.Count) files, $($zones.Count) world(s)"
          if (-not (Test-Path "System\angels95-serv.service")) {
            Write-Error "System\angels95-serv.service missing (referenced by the release notes)"
            exit 1
          }

      - name: Upload System/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-windows
          path: System/
          retention-days: 30

      - name: Package System/ as zip (tagged release only)
        if: startsWith(github.ref, 'refs/tags/b')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path System -DestinationPath "System-$tag.zip"

      - name: Stage individual Windows binaries (tagged release only)
        if: startsWith(github.ref, 'refs/tags/b')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          # Each binary as its own directly downloadable release asset
          Copy-Item "System\Angels95.exe"     "release\Angels95-$tag-windows-x86_64.exe"
          Copy-Item "System\AngelServ.exe"    "release\AngelServ-$tag-windows-x86_64.exe"
          Copy-Item "System\AngelMaster.exe"  "release\AngelMaster-$tag-windows-x86_64.exe"
          Copy-Item "System\AngelEd.exe"      "release\AngelEd-$tag-windows-x86_64.exe"
          Copy-Item "System\OzPack.exe"       "release\OzPack-$tag-windows-x86_64.exe"
          Get-ChildItem release | Select-Object Name, Length

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/b')
        uses: softprops/action-gh-release@v2
        with:
          name: Angels95 Build ${{ github.ref_name }}
          files: |
            System-${{ github.ref_name }}.zip
            release/*.exe
