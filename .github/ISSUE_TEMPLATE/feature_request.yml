name: Feature request
description: Propose a gameplay, engine, editor, or tooling improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. The most actionable requests describe the problem first
        and the proposed solution second - a solution-shaped issue is hard to
        weigh against the roadmap otherwise.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay (combat, movement, inventory, progression)
        - Engine (rendering, collision, physics, scripting)
        - Editor (AngelEd)
        - Content (worlds, maps, assets)
        - Tooling (build, packaging, tests)
        - Documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the current limitation or friction, not the implementation.
      placeholder: |
        When authoring a large world, every brush needs `texPath=` spelled out,
        and a typo silently falls back to a flat colour...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or a smaller change that would also help.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: |
        Screenshots, map names, or references to the roadmap in `Wiki/Engine-Roadmap.md`.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and the roadmap for this idea.
          required: true
        - label: I am willing to help test or implement this.
